<div class="auth-page">
  <div class="auth-container">
    <div class="split-card">
      <!-- Panneau sombre : Formulaire mot de passe oublié -->
      <div class="pane-dark">
        <div class="pane-dark-top">
          <app-langue-selector></app-langue-selector>
        </div>

        <h1 class="auth-title">Récupération</h1>
        <p class="auth-description">
          Entrez votre numéro de téléphone pour recevoir un mot de passe temporaire par SMS.
        </p>

        <form (ngSubmit)="onSubmit()" class="auth-form">
          <div class="form-group">
            <label for="telephone" class="form-label">Numéro de téléphone</label>
            <input
              type="tel"
              id="telephone"
              name="telephone"
              [(ngModel)]="telephone"
              placeholder="ex: 77 123 45 67"
              required
              autocomplete="tel"
              class="input-field"
            />
          </div>

          <div class="erreur-box" *ngIf="erreur">{{ erreur }}</div>
          <div class="succes-box" *ngIf="succes">✅ {{ succes }}</div>

          <button type="submit" class="btn-primary-blue" [disabled]="chargement || !telephone.trim()">
            {{ chargement ? 'Envoi en cours...' : '📱 Recevoir mon mot de passe' }}
          </button>

          <div class="return-link-wrapper">
            <a routerLink="/login" class="link-return">← Retour à la connexion</a>
          </div>
        </form>
      </div>

      <!-- Panneau clair : Branding -->
      <div class="pane-light">
        <a routerLink="/accueil" class="brand-badge-link" title="Retour à l'accueil">
          <div class="brand-badge">
            <div class="brand-logo-content">
              <img src="/image/logo-farmerai.png" alt="FarmerAI" class="brand-logo-img" />
            </div>
          </div>
        </a>

        <h2 class="brand-title"><a routerLink="/accueil" class="brand-title-link">FarmerAI</a></h2>
        <p class="brand-subtitle">Agriculture & IA</p>

        <div class="brand-actions">
          <a routerLink="/login" class="btn-outline-pill">Se connecter</a>
          <div class="secondary-nav-hint">
            <span>Pas encore de compte ?</span>
            <a routerLink="/register" class="link-register">Créer un compte</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="auth-footer">
    <p>Design by FarmerAI - Copyright &copy; 2026.</p>
  </footer>
</div>
