<div class="login-page">
  <div class="login-card">
    <app-langue-selector></app-langue-selector>

    <h1>Mot de passe oublié</h1>
    <p class="sous-titre">
      Entrez votre numéro de téléphone.<br/>
      Vous recevrez un mot de passe temporaire par SMS.
    </p>

    <form (ngSubmit)="onSubmit()">
      <label>
        Téléphone
        <input
          type="tel"
          name="telephone"
          [(ngModel)]="telephone"
          placeholder="ex: 771234567"
          required />
      </label>

      <p class="erreur" *ngIf="erreur">{{ erreur }}</p>
      <p class="succes" *ngIf="succes">✅ {{ succes }}</p>

      <button type="submit" [disabled]="chargement || !telephone.trim()">
        {{ chargement ? 'Envoi en cours...' : '📱 Recevoir le mot de passe' }}
      </button>
    </form>

    <p class="lien-secondaire">
      <a routerLink="/login">← Retour à la connexion</a>
    </p>
  </div>
</div>
