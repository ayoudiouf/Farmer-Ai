<div class="langue-selector">
  <button
    type="button"
    class="langue-bouton"
    (click)="basculer($event)"
    [attr.aria-expanded]="ouvert"
    title="Langue"
  >
    <span class="abrev">{{ langueService.abreviationLangueActuelle() }}</span>
    <span class="fleche" [class.haut]="ouvert">▾</span>
  </button>

  <div class="langue-menu" *ngIf="ouvert">
    <button
      type="button"
      *ngFor="let l of langueService.languesDisponibles"
      class="langue-option"
      [class.active]="l.code === langueService.langueActuelle()"
      (click)="choisir(l.code, $event)"
    >
      <span class="court">{{ l.court }}</span>
      {{ l.label }}
      <span class="coche" *ngIf="l.code === langueService.langueActuelle()">✓</span>
    </button>
  </div>
</div>
