<div class="sidebar-overlay" *ngIf="isOpen" (click)="close()"></div>

<div class="sidebar-panel" [class.open]="isOpen">

  <div class="sidebar-header">
    <div class="brand">
      <img src="/image/logo-farmerai.png" alt="FarmerAI" class="brand-logo" />
      <span class="brand-name">FarmerAI</span>
    </div>
    <button class="close-btn" (click)="close()">✕</button>
  </div>

  <div class="sidebar-user">
    <div class="avatar">{{ initialesUtilisateur }}</div>
    <p class="sidebar-nom">{{ nomUtilisateur }}</p>
  </div>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of menuItems">
      <a [routerLink]="item.route" routerLinkActive="active" (click)="close()">
        <span class="nav-icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>

  <button class="sidebar-logout" (click)="logout()">
    🚪 Déconnexion
  </button>

</div>
